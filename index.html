<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#3b2a1a" />
    <meta name="description" content="Walk the real world as a fantasy realm." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Wanderwild</title>
  </head>
  <body>
    <div id="map" aria-label="Map of the realm around you"></div>
    <div class="parchment-overlay" aria-hidden="true"></div>

    <header class="hud">
      <div class="hud-panel">
        <div class="hud-stat">
          <span class="hud-label">Distance wandered</span>
          <span class="hud-value" id="distance">0 m</span>
        </div>
        <div class="hud-stat" title="Binding seals: walk 100 m to earn one">
          <span class="hud-label">Seals</span>
          <span class="hud-value" id="seals">0</span>
        </div>
      </div>
    </header>

    <div class="notice" id="notice" role="status" hidden></div>

    <button class="install" id="install" type="button" hidden>Install Wanderwild</button>

    <button class="bestiary-button" id="bestiary" type="button" aria-label="Open the bestiary">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M6 10q9-4 18 2v28q-9-6-18-2z" fill="#e8d9b5" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M42 10q-9-4-18 2v28q9-6 18-2z" fill="#e8d9b5" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M11 18q5-2 9 1M11 24q5-2 9 1M28 19q4-3 9-1M28 25q4-3 9-1" stroke="currentColor" stroke-width="1.6" fill="none" />
      </svg>
      <span>Bestiary</span>
    </button>

    <button class="recenter" id="recenter" type="button" aria-label="Follow me" aria-pressed="true">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M24 4l4 20-4 20-4-20z" fill="currentColor" />
        <path d="M4 24l20-4 20 4-20 4z" fill="currentColor" opacity=".5" />
        <circle cx="24" cy="24" r="3" fill="#e8d9b5" />
      </svg>
    </button>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
