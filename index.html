<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#3b2a1a" />
    <meta name="description" content="Walk the real world as a fantasy realm." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Wanderwild</title>
  </head>
  <body>
    <div id="map" aria-label="Map of the realm around you"></div>
    <div class="parchment-overlay" aria-hidden="true"></div>

    <header class="hud">
      <div class="hud-panel hud-bar">
        <div class="hud-level" title="Wayfarer level">
          <span class="hud-level-num" id="level">1</span>
          <span class="hud-xp" role="img" aria-label="XP"><span id="xp-bar"></span></span>
        </div>
        <button class="hud-stat hud-distance hud-steps" id="steps" type="button" aria-label="Steps today">
          <span class="hud-value"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3c2 0 3 2 3 5s-1 5-3 5-3-2-3-5 1-5 3-5zm-.5 11.5c1.6 0 2.5 1 2.5 2.4S8 20 6.5 20 4 19 4 17s1-2.5 2.5-2.5zM17 7c2 0 3 2 3 5s-1 5-3 5-3-2-3-5 1-5 3-5zm-.5 11.5c1.6 0 2.5 1 2.5 2.4S18 24 16.5 24 14 23 14 21s1-2.5 2.5-2.5z" fill="currentColor"/></svg><span id="steps-today">0</span></span>
          <span class="stride-pop" id="stride-pop" aria-live="polite"></span>
        </button>
        <div class="hud-purse">
          <span class="hud-coin" title="Coin"><i aria-hidden="true"></i><span id="coin">0</span></span>
        </div>
      </div>
      <div class="realm-banner" id="realm" role="status" hidden></div>
      <div class="hud-toast" id="toast" role="status" hidden></div>
      <div class="notice" id="notice" role="status" hidden></div>
    </header>

    <!-- The hero's portrait, drawn by the hero page; opens the hero, the Bestiary and the rest. -->
    <button class="journal-open" id="journal-open" type="button" aria-label="Open your hero and bestiary"></button>

    <!-- Map buttons stack upward from the bottom corners; the first child sits lowest.
         Buttons marked rail-extra stay folded behind the "more" button until it is opened. -->
    <nav class="rail rail-left" id="rail-left" aria-label="Wayfarer"></nav>

    <nav class="rail rail-right" id="rail-right" aria-label="Map tools">
      <!-- Shown only once the camera has left the Wayfarer. -->
      <button class="recenter" id="recenter" type="button" aria-label="Back to me" aria-pressed="true" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M24 4l4 20-4 20-4-20z" fill="currentColor" />
          <path d="M4 24l20-4 20 4-20 4z" fill="currentColor" opacity=".5" />
          <circle cx="24" cy="24" r="3" fill="#e8d9b5" />
        </svg>
      </button>
    </nav>

    <div class="banners" id="banners"></div>

    <dialog class="satchel" id="forge" aria-labelledby="forge-title">
      <div class="satchel-body">
        <button class="satchel-close" id="forge-close" type="button" aria-label="Close">×</button>
        <h2 id="forge-title">The Forge</h2>
        <div id="forge-content"></div>
      </div>
    </dialog>

    <dialog class="satchel journal" id="journal" aria-labelledby="journal-title">
      <header class="journal-head">
        <h2 id="journal-title">Wayfarer level 1</h2>
        <button class="satchel-close" id="journal-close" type="button" aria-label="Close">×</button>
        <div class="tabs journal-tabs" role="tablist">
          <button class="tab" id="journal-tab-wayfarer" type="button" role="tab">Hero</button>
          <button class="tab" id="journal-tab-bestiary" type="button" role="tab">Bestiary</button>
          <button class="tab" id="journal-tab-hearth" type="button" role="tab" hidden>Hearth</button>
          <button class="tab" id="journal-tab-settings" type="button" role="tab" aria-label="Settings">⚙</button>
        </div>
      </header>
      <section class="journal-pane" id="journal-wayfarer" role="tabpanel">
        <div id="hero-panel"></div>
        <h3>Party</h3>
        <div id="satchel-party"></div>
        <div id="satchel-hunt"></div>
        <details class="journal-more">
          <summary>Satchel and journey</summary>
          <ul class="satchel-grid" id="satchel-materials"></ul>
          <ul class="satchel-grid" id="satchel-stats"></ul>
          <ol class="satchel-unlocks" id="satchel-unlocks"></ol>
        </details>
      </section>
      <section class="journal-pane" id="journal-bestiary" role="tabpanel" hidden></section>
      <section class="journal-pane" id="journal-hearth" role="tabpanel" hidden></section>
      <section class="journal-pane" id="journal-settings" role="tabpanel" hidden>
        <h3>Sound</h3>
        <div class="choice-row" id="sound-choice" role="radiogroup" aria-label="Sound">
          <button type="button" role="radio" data-mode="all">Music and effects</button>
          <button type="button" role="radio" data-mode="effects">Effects</button>
          <button type="button" role="radio" data-mode="off">Off</button>
        </div>
        <div id="install-row" hidden>
          <h3>App</h3>
          <div class="satchel-actions"><button type="button" id="install">Install Wanderwild</button></div>
        </div>
        <h3>Save</h3>
        <p class="satchel-hint">Kept on this phone. Export a copy to move it to another device.</p>
        <div class="satchel-actions">
          <button type="button" id="save-export">Export save</button>
          <button type="button" id="save-import">Import save</button>
          <input type="file" id="save-file" accept="application/json,.json" hidden />
        </div>
      </section>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
