<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#3b2a1a" />
    <meta name="description" content="Walk the real world as a fantasy realm." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Wanderwild</title>
  </head>
  <body>
    <div id="map" aria-label="Map of the realm around you"></div>
    <div class="parchment-overlay" aria-hidden="true"></div>

    <header class="hud">
      <div class="hud-panel hud-bar">
        <div class="hud-level" title="Wayfarer level">
          <span class="hud-level-num" id="level">1</span>
          <span class="hud-xp" role="img" aria-label="XP"><span id="xp-bar"></span></span>
        </div>
        <div class="hud-stat hud-distance">
          <span class="hud-label">Wandered</span>
          <span class="hud-value" id="distance">0 m</span>
          <span class="stride-pop" id="stride-pop" aria-live="polite"></span>
        </div>
        <div class="hud-purse">
          <span class="hud-coin" title="Coin"><i aria-hidden="true"></i><span id="coin">0</span></span>
          <span class="hud-light" title="Wanderlight"><i aria-hidden="true"></i><span id="wanderlight">0</span></span>
          <span class="hud-seals" title="Binding seals: walk 100 m to earn one"><i aria-hidden="true"></i><span id="seals">0</span></span>
        </div>
      </div>
      <div class="realm-banner" id="realm" role="status" hidden></div>
      <div class="hud-toast" id="toast" role="status" hidden></div>
    </header>

    <div class="notice" id="notice" role="status" hidden></div>

    <button class="install" id="install" type="button" hidden>Install Wanderwild</button>

    <button class="bestiary-button" id="bestiary" type="button" aria-label="Open the bestiary">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M6 10q9-4 18 2v28q-9-6-18-2z" fill="#e8d9b5" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M42 10q-9-4-18 2v28q9-6 18-2z" fill="#e8d9b5" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M11 18q5-2 9 1M11 24q5-2 9 1M28 19q4-3 9-1M28 25q4-3 9-1" stroke="currentColor" stroke-width="1.6" fill="none" />
      </svg>
      <span>Bestiary</span>
    </button>

    <button class="recenter" id="recenter" type="button" aria-label="Follow me" aria-pressed="true">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M24 4l4 20-4 20-4-20z" fill="currentColor" />
        <path d="M4 24l20-4 20 4-20 4z" fill="currentColor" opacity=".5" />
        <circle cx="24" cy="24" r="3" fill="#e8d9b5" />
      </svg>
    </button>

    <button class="satchel-open" id="satchel-open" type="button" aria-label="Open satchel">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M14 18c0-7 4-11 10-11s10 4 10 11" fill="none" stroke="currentColor" stroke-width="3" />
        <path d="M8 18h32l-3 22H11z" fill="currentColor" />
        <path d="M8 18h32v6H8z" fill="#e8d9b5" opacity=".35" />
        <circle cx="24" cy="28" r="3" fill="#e8d9b5" />
      </svg>
    </button>

    <button class="hearthstead-open" id="hearthstead-open" type="button" aria-label="Open Hearthstead" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M6 24L24 9l18 15" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" />
        <path d="M11 22v18h26V22L24 11z" fill="currentColor" />
        <path d="M20 40V30h8v10" fill="#e8d9b5" opacity=".5" />
        <path d="M31 14v-5h4v8" fill="currentColor" />
      </svg>
    </button>

    <dialog class="satchel" id="hearthstead" aria-labelledby="hearthstead-title">
      <div class="satchel-body">
        <button class="satchel-close" id="hearthstead-close" type="button" aria-label="Close">×</button>
        <h2 id="hearthstead-title">The Hearthstead</h2>
        <div id="hearthstead-content"></div>
      </div>
    </dialog>

    <dialog class="satchel" id="satchel" aria-labelledby="satchel-level">
      <div class="satchel-body">
        <button class="satchel-close" id="satchel-close" type="button" aria-label="Close">×</button>
        <h2 id="satchel-level">Wayfarer level 1</h2>
        <p id="satchel-xp"></p>
        <p class="satchel-next" id="satchel-next"></p>
        <h3>Satchel</h3>
        <ul class="satchel-grid" id="satchel-materials"></ul>
        <h3>Journey</h3>
        <ul class="satchel-grid" id="satchel-stats"></ul>
        <h3>Party</h3>
        <div id="satchel-party"></div>
        <h3>Path of the Wayfarer</h3>
        <ol class="satchel-unlocks" id="satchel-unlocks"></ol>
        <h3>Save</h3>
        <p class="satchel-hint">Progress is kept on this phone. Export a copy to move it to another device.</p>
        <div class="satchel-actions">
          <button type="button" id="save-export">Export save</button>
          <button type="button" id="save-import">Import save</button>
          <input type="file" id="save-file" accept="application/json,.json" hidden />
        </div>
      </div>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
